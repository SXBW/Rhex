name: Publish Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
    - "**.md"
    - "**.mdx"
    - "docs/**"
    - ".github/**"

    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref_name }}
  cancel-in-progress: true
  
jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/rhex
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          build-args: |
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
            NEXT_ASSET_PREFIX=https://rhex-runtime-asset-prefix.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Clean up old untagged images (keep latest untagged as fallback)
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -o pipefail
          PACKAGE="rhex"
          
          API_URL="https://api.github.com/user/packages/container/$PACKAGE/versions?per_page=100"
          
          VERSIONS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$API_URL")
          
          UNTAGGED_DELETE=$(echo "$VERSIONS" | jq -r '
            [.[] | select(.metadata.container.tags == []) | {id, created_at}]
            | sort_by(.created_at)
            | .[:length-1][]
            | .id
          ')
          
          TOTAL=$(echo "$VERSIONS" | jq '[.[] | select(.metadata.container.tags == [])] | length')
          DELETE=$(( TOTAL > 1 ? TOTAL - 1 : 0 ))
          
          if [ "$DELETE" -gt 0 ]; then
            echo "Found $TOTAL untagged images, deleting $DELETE (keeping 1 as fallback)"
            echo "$UNTAGGED_DELETE" | while read -r version_id; do
              if [ -n "$version_id" ]; then
                echo "Deleting version $version_id..."
                curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  "$API_URL/$version_id"
              fi
            done
          else
            echo "No untagged images to delete (keeping $TOTAL as fallback)"
          fi