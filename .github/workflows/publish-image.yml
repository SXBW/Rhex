name: Publish Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
    - "**.md"
    - "**.mdx"
    - "docs/**"
    - ".github/**"

    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref_name }}
  cancel-in-progress: true
  
jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/rhex
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          build-args: |
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
            NEXT_ASSET_PREFIX=https://rhex-runtime-asset-prefix.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Clean up old images (keep 2 most recent builds)
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          PACKAGE="rhex"

          # Detect whether the owner is an org or a user
          if gh api "orgs/$OWNER" >/dev/null 2>&1; then
            API_PREFIX="orgs/$OWNER/packages/container/$PACKAGE/versions"
          else
            API_PREFIX="user/packages/container/$PACKAGE/versions"
          fi

          echo "Using API endpoint: $API_PREFIX"

          VERSIONS=$(gh api --paginate "$API_PREFIX" --jq '.')

          TOTAL=$(echo "$VERSIONS" | jq 'length')
          echo "Found $TOTAL version(s)"

          if [ "$TOTAL" -le 2 ]; then
            echo "Nothing to delete (keeping all)"
            exit 0
          fi

          DELETE_COUNT=$(( TOTAL - 2 ))

          echo "Deleting $DELETE_COUNT old version(s), keeping 2 most recent..."
          echo "$VERSIONS" | jq -r '
            sort_by(.created_at) | reverse | .[2:][]
          ' | jq -c '.' | while read -r version; do
            VERSION_ID=$(echo "$version" | jq -r '.id')
            TAGS=$(echo "$version" | jq -r '.metadata.container.tags | join(",") // "untagged"')
            echo "  Deleting version $VERSION_ID (tags: $TAGS)"
            gh api -X DELETE "$API_PREFIX/$VERSION_ID" || echo "  Failed to delete $VERSION_ID"
          done
          echo "Cleanup complete"