name: Publish Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
    - "**.md"
    - "**.mdx"
    - "docs/**"
    - ".github/**"

    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref_name }}
  cancel-in-progress: true
  
jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/rhex
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          build-args: |
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
            NEXT_ASSET_PREFIX=https://rhex-runtime-asset-prefix.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Clean up old images (keep 2 most recent builds)
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -o pipefail
          PACKAGE="rhex"

          API_URL="https://api.github.com/user/packages/container/$PACKAGE/versions?per_page=100"

          VERSIONS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$API_URL")

          TOTAL=$(echo "$VERSIONS" | jq 'length')

          if [ "$TOTAL" -le 2 ]; then
            echo "Found $TOTAL version(s), nothing to delete (keeping all)"
            exit 0
          fi

          DELETE_COUNT=$(( TOTAL - 2 ))

          DELETE_IDS=$(echo "$VERSIONS" | jq -r '
            [.[] | {id, created_at, tags: (.metadata.container.tags // [])}]
            | sort_by(.created_at)
            | reverse
            | .[2:][]
            | .id
          ')

          echo "Found $TOTAL versions, deleting $DELETE_COUNT (keeping 2 most recent)"
          echo "$DELETE_IDS" | while read -r version_id; do
            if [ -n "$version_id" ]; then
              TAGS=$(echo "$VERSIONS" | jq -r --argjson vid "$version_id" '.[] | select(.id == $vid) | .metadata.container.tags | join(",") // "untagged"')
              echo "Deleting version $version_id (tags: $TAGS)..."
              curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "$API_URL/$version_id"
            fi
          done
          echo "Cleanup complete"