name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rhex
          tags: |
            # 仅在 main 分支推送时生成 latest 标签
            type=raw,value=latest,enable={{is_default_branch}}
            # 语义化版本标签（例如 v1.2.3 → 1.2.3, 1.2, 1）
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 保留原始 git ref 标签（例如 v1.0.0）
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Debug generated tags
        run: |
          echo "Generated tags: ${{ steps.meta.outputs.tags }}"
          echo "Generated labels: ${{ steps.meta.outputs.labels }}"
          echo "Current ref: ${{ github.ref }}"
          echo "Is default branch: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
            NEXT_ASSET_PREFIX=https://rhex-runtime-asset-prefix.invalid
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test?schema=public
            REDIS_URL=redis://127.0.0.1:6379
          secrets: |
            "session_secret=build-session-secret-for-testing-only"
            "captcha_secret_key=build-captcha-secret-for-testing-only"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed image
        run: |
          echo "Verifying pushed image..."
          TAGS="${{ steps.meta.outputs.tags }}"
          echo "$TAGS" | tr ',' '\n' | while read tag; do
            if [ -n "$tag" ]; then
              echo "Checking tag: $tag"
              docker pull "$tag" && echo "✅ Successfully pulled $tag" || echo "❌ Failed to pull $tag"
            fi
          done

      - name: Clean up old untagged images
        if: github.ref_name == 'main'
        run: |
          OWNER="${{ github.repository_owner }}"
          PACKAGE="rhex"
          
          echo "Starting cleanup of untagged images for $OWNER/$PACKAGE..."
          
          API_URL="https://api.github.com/user/packages/container/$PACKAGE/versions"
          
          # 获取所有版本，带重试机制
          for i in 1 2 3; do
            RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$API_URL")
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            VERSIONS=$(echo "$RESPONSE" | sed '$d')
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Successfully fetched package versions"
              break
            else
              echo "Attempt $i failed with HTTP code $HTTP_CODE, retrying..."
              sleep 3
            fi
          done
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Failed to fetch package versions after 3 attempts"
            exit 1
          fi
          
          # 提取未标记的版本 ID
          UNTAGGED_VERSIONS=$(echo "$VERSIONS" | jq -r '.[] | select(.metadata.container.tags == [] or .metadata.container.tags == null) | .id')
          
          if [ -n "$UNTAGGED_VERSIONS" ] && [ "$UNTAGGED_VERSIONS" != "null" ]; then
            COUNT=$(echo "$UNTAGGED_VERSIONS" | grep -c '[^[:space:]]')
            echo "Found $COUNT untagged images to delete"
            
            # 限制每次清理数量，避免 API rate limiting
            echo "$UNTAGGED_VERSIONS" | head -n 10 | while read -r version_id; do
              if [ -n "$version_id" ] && [ "$version_id" != "null" ]; then
                echo "Deleting version $version_id..."
                DELETE_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                  -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  "$API_URL/$version_id")
                
                case $DELETE_RESPONSE in
                  204)
                    echo "✅ Successfully deleted version $version_id"
                    ;;
                  404)
                    echo "⚠️ Version $version_id not found (already deleted)"
                    ;;
                  429)
                    echo "⏳ Rate limited, waiting before continuing..."
                    sleep 30
                    ;;
                  *)
                    echo "❌ Failed to delete version $version_id (HTTP $DELETE_RESPONSE)"
                    ;;
                esac
              fi
            done
          else
            echo "No untagged images to delete"
          fi
          
          echo "Cleanup completed"