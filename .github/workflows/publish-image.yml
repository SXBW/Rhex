name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rhex
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean up old untagged images
        if: github.ref_name == 'main'
        run: |
          OWNER="${{ github.repository_owner }}"
          PACKAGE="rhex"
          
          API_URL="https://api.github.com/user/packages/container/$PACKAGE/versions"
          
          VERSIONS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$API_URL")
          
          UNTAGGED_VERSIONS=$(echo "$VERSIONS" | jq -r '.[] | select(.metadata.container.tags == []) | .id')
          
          if [ -n "$UNTAGGED_VERSIONS" ]; then
            echo "Found $(echo "$UNTAGGED_VERSIONS" | wc -l) untagged images to delete"
            echo "$UNTAGGED_VERSIONS" | while read -r version_id; do
              if [ -n "$version_id" ]; then
                echo "Deleting version $version_id..."
                curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  "$API_URL/$version_id"
              fi
            done
          else
            echo "No untagged images to delete"
          fi