name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rhex
          tags: |
            # 总是生成 latest 标签（仅在默认分支）
            type=raw,value=latest,enable={{is_default_branch}}
            # 语义化版本标签（例如 v1.2.3 → 1.2.3, 1.2, 1）
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 保留原始 git ref 标签
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
            NEXT_ASSET_PREFIX=https://rhex-runtime-asset-prefix.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max
          progress: plain
          # 注意：env 应该放在这里，而不是作为 build-args
          secrets: |
            "session_secret=build-session-secret-for-testing-only"
            "captcha_secret_key=build-captcha-secret-for-testing-only"

      - name: Clean up old untagged images
        if: github.ref_name == 'main'
        run: |
          OWNER="${{ github.repository_owner }}"
          PACKAGE="rhex"
          
          API_URL="https://api.github.com/user/packages/container/$PACKAGE/versions"
          
          # 添加重试逻辑和错误处理
          for i in 1 2 3; do
            VERSIONS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$API_URL")
            if [ $? -eq 0 ]; then
              break
            fi
            sleep 2
          done
          
          UNTAGGED_VERSIONS=$(echo "$VERSIONS" | jq -r '.[] | select(.metadata.container.tags == [] or .metadata.container.tags == null) | .id')
          
          if [ -n "$UNTAGGED_VERSIONS" ] && [ "$UNTAGGED_VERSIONS" != "null" ]; then
            COUNT=$(echo "$UNTAGGED_VERSIONS" | grep -c '[^[:space:]]')
            echo "Found $COUNT untagged images to delete"
            echo "$UNTAGGED_VERSIONS" | while read -r version_id; do
              if [ -n "$version_id" ] && [ "$version_id" != "null" ]; then
                echo "Deleting version $version_id..."
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                  -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  "$API_URL/$version_id")
                echo "Delete response code: $HTTP_CODE"
              fi
            done
          else
            echo "No untagged images to delete"
          fi