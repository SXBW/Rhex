name: Upstream Sync

permissions:
    contents: write
    workflows: write

on:
    schedule:
        - cron: '0 * * * *'
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    sync:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4.3.0
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Configure Git
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git config user.name "GitHub Action"
                  git config user.email "action@github.com"
                  git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

            - name: Fetch upstream
              run: |
                  git remote add upstream https://github.com/lovedevpanda/Rhex.git 2>/dev/null || true
                  git fetch upstream main

            - name: Backup local files
              run: |
                  mkdir -p /tmp/keep/.github
                  for f in .gitignore .sync-ignore; do
                      [ -f "$f" ] && cp "$f" /tmp/keep/ && echo "Backed up: $f"
                  done
                  [ -d .github/workflows ] && cp -r .github/workflows /tmp/keep/.github/ && echo "Backed up: .github/workflows"

            - name: Sync
              run: |
                  git reset --hard upstream/main

            - name: Restore local files
              run: |
                  for f in /tmp/keep/*; do
                      [ -f "$f" ] && cp "$f" . && echo "Restored: $(basename $f)"
                  done
                  [ -d /tmp/keep/.github/workflows ] && mkdir -p .github && cp -r /tmp/keep/.github/workflows .github/ && echo "Restored: .github/workflows"

            - name: Commit and push
              id: commit
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git add .
                  if git diff --quiet && git diff --cached --quiet; then
                    echo "No changes"
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  git commit -m "Sync: upstream main"
                  git push -f origin main
                  echo "changed=true" >> "$GITHUB_OUTPUT"

            - name: Trigger Docker build
              if: steps.commit.outputs.changed == 'true'
              uses: benc-uk/workflow-dispatch@v1
              with:
                workflow: Publish Docker Image
                ref: main
