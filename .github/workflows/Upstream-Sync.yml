name: Upstream Sync

permissions:
    contents: write

on:
    schedule:
        - cron: '0 * * * *'
    workflow_dispatch:

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Configure Git
              run: |
                  git config user.name "GitHub Action"
                  git config user.email "action@github.com"

            - name: Add upstream remote
              run: |
                  git remote add upstream https://github.com/lovedevpanda/Rhex.git

            - name: Fetch upstream changes
              run: |
                  git fetch upstream

            - name: Check for new commits
              id: check_commits
              run: |
                  LOCAL=$(git rev-parse HEAD)
                  REMOTE=$(git rev-parse upstream/main)
                  if [ "$LOCAL" != "$REMOTE" ]; then
                      echo "has_new_commits=true" >> $GITHUB_OUTPUT
                      echo "New commits found in upstream!"
                  else
                      echo "has_new_commits=false" >> $GITHUB_OUTPUT
                      echo "No new commits in upstream."
                  fi

            - name: Save local files
              if: steps.check_commits.outputs.has_new_commits == 'true'
              run: |
                  mkdir -p /tmp/local-files
                  # 保存本地文件（这些文件不同步上游）
                  cp .gitignore /tmp/local-files/
                  cp .github/workflows/publish-image.yml /tmp/local-files/
                  echo "Saved local files"

            - name: Reset to upstream
              if: steps.check_commits.outputs.has_new_commits == 'true'
              run: |
                  git reset --hard upstream/main

            - name: Restore local files
              if: steps.check_commits.outputs.has_new_commits == 'true'
              run: |
                  # 恢复本地文件
                  cp /tmp/local-files/.gitignore ./
                  cp /tmp/local-files/publish-image.yml .github/workflows/
                  echo "Restored local files"

            - name: Commit and push
              if: steps.check_commits.outputs.has_new_commits == 'true'
              run: |
                  git add .
                  git commit -m "Sync: upstream main to HEAD

Co-authored-by: lovedevpanda <noreply@github.com>
 upstream: ${{ github.event.inputs.upstream_ref || 'main' }}"

                  git push -f origin main
