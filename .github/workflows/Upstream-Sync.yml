name: Upstream Sync

permissions:
    contents: write

on:
    schedule:
        - cron: '0 * * * *'
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    sync:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4.2.0
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Configure Git
              run: |
                  git config user.name "GitHub Action"
                  git config user.email "action@github.com"

            - name: Fetch upstream
              run: |
                  git remote add upstream https://github.com/lovedevpanda/Rhex.git 2>/dev/null || true
                  git fetch upstream main

            - name: Backup local files
              run: |
                  mkdir -p /tmp/keep
                  for f in .gitignore .sync-ignore .github/workflows/publish-image.yml; do
                      [ -f "$f" ] && cp "$f" /tmp/keep/ && echo "Backed up: $f"
                  done

            - name: Sync
              run: |
                  git reset --hard upstream/main

            - name: Restore local files
              run: |
                  for f in /tmp/keep/*; do
                      [ -f "$f" ] && cp "$f" . && echo "Restored: $(basename $f)"
                  done

            - name: Commit and push
              run: |
                  git add .
                  git diff --quiet && git diff --cached --quiet && echo "No changes" && exit 0
                  git commit -m "Sync: upstream main"
                  git push -f origin main
